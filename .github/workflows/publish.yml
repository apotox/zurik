name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      # Authenticates via trusted publishing (no token) and adds provenance automatically.
      # Configure once on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
      # repository apotox/zurik, workflow publish.yml.
      - name: Publish
        run: npm publish --access public
