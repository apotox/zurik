name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing and provenance
  packages: write # required to publish to GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10. Pinned range, not
      # @latest, so a release doesn't ship with whichever npm majors landed that morning.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      # Authenticates via trusted publishing (no token) and adds provenance automatically.
      # Configure once on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
      # repository apotox/zurik, workflow publish.yml.
      - name: Publish
        run: npm publish --access public

      # Mirror to GitHub Packages so it shows in the repo's Packages sidebar.
      # That registry requires an owner-scoped name; the rename is CI-only.
      - name: Set up GitHub Packages registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@apotox'

      - name: Publish to GitHub Packages
        run: |
          npm pkg set name=@apotox/zurik
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
