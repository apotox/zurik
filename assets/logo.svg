<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220" role="img" aria-labelledby="t">
  <title id="t">zurik mascot: a cheerful padlock waving from the Alps, holding its key</title>
  <g stroke="#1c1917" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Alps -->
    <path d="M4 200L46 104l36 46L186 46l50 154z" fill="#bae6fd"/>
    <path d="M172 72l14-26 14 26-5 5-6-5-6 6zM38 120l8-16 10 15-5 4-5-4z" fill="#fff" stroke-width="4"/>
    <!-- snow hill -->
    <path d="M4 206q116-36 232 0" fill="#fff"/>
    <g transform="rotate(-8 120 140)">
      <!-- legs -->
      <path d="M104 176v16M138 176v16" stroke-width="7"/>
      <ellipse cx="99" cy="196" rx="10" ry="6" fill="#1c1917"/>
      <ellipse cx="143" cy="196" rx="10" ry="6" fill="#1c1917"/>
      <!-- waving arm -->
      <path d="M64 128q-22-4-28-30" fill="none" stroke-width="7"/>
      <circle cx="35" cy="94" r="8" fill="#e7e5e4"/>
      <!-- shackle -->
      <path d="M92 98V80a28 28 0 0 1 56 0v18" fill="none" stroke-width="25"/>
      <path d="M92 98V80a28 28 0 0 1 56 0v18" fill="none" stroke="#e7e5e4" stroke-width="13"/>
      <!-- body -->
      <rect x="58" y="90" width="124" height="90" rx="40" fill="#ef4444" stroke-width="6"/>
      <path d="M76 104q8-6 18-6" fill="none" stroke="#fff" stroke-width="5" opacity=".7"/>
      <!-- face: open eye + wink -->
      <circle cx="100" cy="128" r="8" fill="#1c1917" stroke="none"/>
      <circle cx="103" cy="124.5" r="2.8" fill="#fff" stroke="none"/>
      <path d="M132 129q8-9 16 0" fill="none" stroke-width="4.5"/>
      <ellipse cx="84" cy="146" rx="9" ry="5.5" fill="#fecdd3" stroke="none"/>
      <ellipse cx="158" cy="146" rx="9" ry="5.5" fill="#fecdd3" stroke="none"/>
      <path d="M110 142h22q-2 14-11 14t-11-14z" fill="#1c1917" stroke-width="3.5"/>
      <path d="M115 152q6-5 12 0q-3 4-6 4t-6-4z" fill="#fb7185" stroke="none"/>
      <!-- arm holding the key -->
      <path d="M180 140q16 2 20 16" fill="none" stroke-width="7"/>
      <path d="M212 160h16M222 160v7M228 160v5" fill="none" stroke="#1c1917" stroke-width="10"/>
      <path d="M212 160h16M222 160v7M228 160v5" fill="none" stroke="#facc15" stroke-width="4"/>
      <circle cx="206" cy="160" r="9" fill="#facc15"/>
      <circle cx="206" cy="160" r="3" fill="#fff" stroke-width="3"/>
      <circle cx="199" cy="157" r="8" fill="#e7e5e4"/>
    </g>
  </g>
</svg>
